{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Convertisseur Sage</title>
    
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/m3hdi-sys/Convert_Sage/main/convertisseur/static/sagelogo.jpg">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1e272e; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;}
        .container { background: #2f3640; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 650px; width: 100%; border-top: 5px solid #2ecc71; }
        h1 { color: #2ecc71; margin-top: 0; font-size: 32px; }
        
        /* --- DESCRIPTION PLUS SÉRIEUSE --- */
        p { color: #dcdde1; line-height: 1.5; margin-bottom: 25px; font-size: 15px;}
        
        input[type="file"] { margin-bottom: 10px; padding: 40px 20px; width: 100%; box-sizing: border-box; background: #353b48; border: 2px dashed #718093; color: #dcdde1; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        input[type="file"]:hover { border-color: #2ecc71; background: #3c4452; }
        input[type="file"]::file-selector-button { background: transparent; color: #2ecc71; border: 2px solid #2ecc71; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-right: 20px; font-weight: bold; transition: all 0.3s ease;}
        input[type="file"]::file-selector-button:hover { background: #2ecc71; color: #1e272e; }

        #liste-fichiers { display: none; background: #1e272e; border-radius: 8px; padding: 15px; margin-bottom: 25px; text-align: left; max-height: 300px; overflow-y: auto; border: 1px solid #718093; }
        .fichier-item { display: flex; justify-content: space-between; align-items: center; color: #2ecc71; font-size: 14px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #353b48; }
        .fichier-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        
        .fichier-info { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden;}
        .fichier-info::before { content: '📄'; }
        .nom-fichier { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        
        .select-client { background: #2f3640; color: #dcdde1; border: 1px solid #2ecc71; padding: 6px 10px; border-radius: 4px; outline: none; margin-left: 10px; margin-right: 10px; cursor: pointer; font-size: 13px;}
        .select-client:focus { box-shadow: 0 0 5px rgba(46, 204, 113, 0.5); }

        .btn-supprimer { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 16px; transition: 0.3s; padding: 0 5px;}
        .btn-supprimer:hover { transform: scale(1.2); }

        .options-format { display: flex; justify-content: space-between; margin-bottom: 25px; background: #353b48; padding: 15px; border-radius: 8px; flex-wrap: wrap; gap: 10px;}
        .options-format label { cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; color: #dcdde1; transition: 0.3s; font-size: 14px;}
        .options-format label:hover { color: #2ecc71; }
        .options-format input[type="radio"] { accent-color: #2ecc71; transform: scale(1.2); }

        button[type="submit"] { background: #2ecc71; color: #1e272e; border: none; padding: 16px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
        button[type="submit"]:hover { background: #27ae60; color: white; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4); }

        #zone-progression { display: none; margin-top: 25px; }
        .texte-progression { color: #2ecc71; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        .barre-fond { background: #1e272e; border-radius: 20px; width: 100%; height: 12px; overflow: hidden; }
        .barre-remplissage { background: #2ecc71; width: 0%; height: 100%; border-radius: 20px; transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Import Sage</h1>
        <p>Glissez vos fichiers de ventes. Associez chaque fichier à son entreprise pour activer la reconnaissance automatique des clients.</p>
        
        <form method="POST" enctype="multipart/form-data" id="form-conversion">
            {% csrf_token %}
            
            <input type="file" name="fichiers_csv" accept=".csv, .xls, .xlsx" multiple id="input-fichiers">
            
            <div id="liste-fichiers"></div>
            
            <div class="options-format">
                <label><input type="radio" name="format_sortie" value="xlsx" checked> 📊 Excel (.xlsx)</label>
                <label><input type="radio" name="format_sortie" value="csv"> 📝 Texte (.csv)</label>
                <label><input type="radio" name="format_sortie" value="zip"> 📦 Les deux (.zip)</label>
            </div>

            <button type="submit" id="btn-generer">Générer Fichiers Sage</button>
        </form>

        <div id="zone-progression">
            <div class="texte-progression" id="texte-statut">Préparation des données...</div>
            <div class="barre-fond"><div class="barre-remplissage" id="barre-anim"></div></div>
        </div>
    </div>

    <script>
        const inputFichiers = document.getElementById('input-fichiers');
        const listeFichiersDiv = document.getElementById('liste-fichiers');
        const dataTransfer = new DataTransfer();

        inputFichiers.addEventListener('change', function() {
            for (let i = 0; i < this.files.length; i++) {
                let existe = false;
                for (let j = 0; j < dataTransfer.files.length; j++) {
                    if (dataTransfer.files[j].name === this.files[i].name) existe = true;
                }
                if (!existe) dataTransfer.items.add(this.files[i]);
            }
            mettreAJourAffichage();
        });

        function mettreAJourAffichage() {
            listeFichiersDiv.innerHTML = '';
            inputFichiers.files = dataTransfer.files;

            if (dataTransfer.files.length > 0) {
                listeFichiersDiv.style.display = 'block';
                
                Array.from(dataTransfer.files).forEach((fichier, index) => {
                    const item = document.createElement('div');
                    item.className = 'fichier-item';
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'fichier-info';
                    
                    const nomSpan = document.createElement('span');
                    nomSpan.className = 'nom-fichier';
                    nomSpan.textContent = fichier.name;
                    nomSpan.title = fichier.name;
                    
                    // --- LE MENU SIMPLIFIÉ ---
                    const selectBox = document.createElement('select');
                    selectBox.name = 'regle_' + fichier.name; 
                    selectBox.className = 'select-client';
                    selectBox.innerHTML = `
                        <option value="DEFAUT">Standard (Auto)</option>
                        <option value="SARL_MOMENT">🏢 SARL MOMENT (Clients personnalisés)</option>
                    `;

                    const btnSuppr = document.createElement('button');
                    btnSuppr.innerHTML = '❌';
                    btnSuppr.className = 'btn-supprimer';
                    btnSuppr.type = 'button';
                    
                    btnSuppr.onclick = function() {
                        dataTransfer.items.remove(index);
                        mettreAJourAffichage();
                    };

                    infoDiv.appendChild(nomSpan);
                    item.appendChild(infoDiv);
                    item.appendChild(selectBox);
                    item.appendChild(btnSuppr);
                    listeFichiersDiv.appendChild(item);
                });
            } else {
                listeFichiersDiv.style.display = 'none';
            }
        }

        document.getElementById('form-conversion').addEventListener('submit', function(e) {
            if(dataTransfer.files.length === 0) {
                e.preventDefault();
                alert("Veuillez sélectionner au moins un fichier !");
                return;
            }

            document.getElementById('btn-generer').style.display = 'none';
            document.getElementById('zone-progression').style.display = 'block';
            
            let largeur = 0;
            const barre = document.getElementById('barre-anim');
            const texte = document.getElementById('texte-statut');
            
            const interval = setInterval(function() {
                largeur += 2; 
                barre.style.width = largeur + '%';
                if(largeur === 50) texte.innerText = "Lecture du contenu des fichiers...";
                if (largeur >= 100) {
                    clearInterval(interval);
                    texte.innerText = "✅ Téléchargement prêt !";
                    setTimeout(() => {
                        document.getElementById('zone-progression').style.display = 'none';
                        document.getElementById('btn-generer').style.display = 'block';
                        barre.style.width = '0%';
                        texte.innerText = "Préparation des données...";
                        dataTransfer.items.clear();
                        mettreAJourAffichage();
                    }, 3000);
                }
            }, 30);
        });
    </script>
</body>
</html>
